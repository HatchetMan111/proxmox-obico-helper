name: Lint & Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck & Sandbox-Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck zstd

      - name: Syntaxprüfung
        run: bash -n obico-proxmox-helper.sh && bash -n tests/sandbox-test.sh

      - name: ShellCheck
        run: shellcheck -S warning obico-proxmox-helper.sh tests/sandbox-test.sh

      - name: Sandbox-Tests
        run: bash tests/sandbox-test.sh
